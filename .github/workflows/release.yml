# A pushed version tag IS the release: verify the tagged tree, then open the
# GitHub Release with generated notes. The npm publish stays a separate manual
# step (it requires the owner's 2FA OTP).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json only
      # (a "version" input alongside packageManager is a hard error in
      # pnpm/action-setup).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - env:
          GH_TOKEN: ${{ github.token }}
        # The body is AUTHORED, not generated: the fixed version-compatibility
        # banner (older dsh users must install an older plugin release) plus the
        # notes committed for THIS tag. A tag whose notes file is missing fails
        # the job instead of publishing a body assembled from PR titles.
        run: |
          NOTES=".github/releases/${GITHUB_REF_NAME}.md"
          test -f "$NOTES" || { echo "missing $NOTES"; exit 1; }
          cat .github/release-header.md "$NOTES" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file /tmp/release-notes.md
